# File: db-origins.yaml
# Version: 1.1.0
# Order of layers defines priority (first layer = highest priority, overrides duplicates below).
# Default source type is "markdown_dir" (only crawler outlier sources need an explicit "type").

layers:
  - id: "official"
    output: "public/songs.db"
    also_copy_to: "dist-dbs/songs-official.db"
    sources:
      - path: "${ACORDISMO_OFFICIAL_DIR:-../smallhotelroom.github.io/src/contents/songs}"
        playlist: "★ Small Hotel Room"

  - id: "curated"
    output: "dist-dbs/songs-curated.db"
    sources:
      - path: "${ACORDISMO_CURATED_DIR}/0-GUITAR/english"
        playlist: "English"
      - path: "${ACORDISMO_CURATED_DIR}/0-GUITAR/espanol"
        playlist: "Español"
      - path: "${ACORDISMO_CURATED_DIR}/0-GUITAR/francais"
        playlist: "Français"
      - path: "${ACORDISMO_CURATED_DIR}/0-GUITAR/italiano"
        playlist: "Italiano"
      - path: "${ACORDISMO_CURATED_DIR}/0-GUITAR/japanese"
        playlist: "日本"
      - path: "${ACORDISMO_CURATED_DIR}/0-GUITAR/portugues"
        playlist: "Português"
    playlists:
      - name: "★ cancionesdejuan"
        match: "Cancionesdejuan - *"
      - name: "★ Small Hotel Room"
        match: "Small Hotel Room - *"
      - name: "★ Metal, Rock y Punk"
        from_file: "${ACORDISMO_CURATED_DIR}/additionalPlaylists/metal-rock-punk.txt"

  - id: "crawler"
    output: "dist-dbs/songs-crawler.db"
    sources:
      - type: "dataset_zk"
        path: "${ACORDISMO_CRAWLER_DIR}"
        cache: "${ACORDISMO_CRAWLER_CACHE_DIR}"
        subdir: "${ACORDISMO_ZK_SUBDIR}"
        playlist: "OrigenZK"
        max_errors: 5
      - type: "dataset_lk"
        path: "${ACORDISMO_CRAWLER_DIR}"
        cache: "${ACORDISMO_CRAWLER_CACHE_DIR}"
        subdir: "${ACORDISMO_LK_SUBDIR}"
        playlist: "OrigenLK"
        max_errors: 5

merged_output: "dist-dbs/songs-merged.db"
