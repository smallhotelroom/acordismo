# File: docker-compose.yml
# Version: 1.5.0
services:
  android-builder:
    build: .
    container_name: acordismo-android-builder
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
      - npm-cache:/root/.npm
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - GRADLE_TASK=${GRADLE_TASK:-assembleDebug}
    command: >
      bash -c "
        npm run build &&
        npx cap sync android &&
        cd android &&
        (./gradlew $${GRADLE_TASK} --build-cache || ./gradlew $${GRADLE_TASK} --build-cache --offline) &&
        for dir in app/build/outputs/apk/debug app/build/outputs/apk/release; do
          latest=$$(ls -t $$dir/acordismo-*.apk 2>/dev/null | head -n 1);
          if [ -n \"$$latest\" ]; then
            cp -f \"$$latest\" \"$$dir/app-$$(basename $$dir).apk\";
          fi;
        done &&
        chown -R $(stat -c '%u:%g' /app) /app/dist /app/android
      "

volumes:
  gradle-cache:
  npm-cache:
