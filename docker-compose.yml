# File: docker-compose.yml
# Version: 1.6.1
services:
  android-builder:
    image: ghcr.io/smallhotelroom/acordismo-android-builder:latest
    build: .
    container_name: acordismo-android-builder
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
      - npm-cache:/root/.npm
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - GRADLE_TASK=${GRADLE_TASK:-assembleDebug}
    command: >
      bash -c "
        if [ -z \"$$(ls -A /root/.gradle/wrapper/dists 2>/dev/null)\" ] && [ -f /opt/gradle-dist/gradle-8.11.1-all.zip ]; then
          mkdir -p /root/.gradle/wrapper/dists/gradle-8.11.1-all/2qik7nd48slq1ooc2496pTF4i &&
          cp /opt/gradle-dist/gradle-8.11.1-all.zip /root/.gradle/wrapper/dists/gradle-8.11.1-all/2qik7nd48slq1ooc2496pTF4i/;
        fi &&
        npm run build &&
        if [ ! -f android/capacitor.settings.gradle ]; then
          npx cap sync android;
        else
          npx cap copy android;
        fi &&
        cd android &&
        (./gradlew $${GRADLE_TASK} --build-cache --offline || ./gradlew $${GRADLE_TASK} --build-cache) &&
        ts=$$(date +'%Y-%m-%d_%H-%M') &&
        for type in debug release; do
          src=\"app/build/outputs/apk/$$type/app-$$type.apk\";
          if [ -f \"$$src\" ]; then
            cp -f \"$$src\" \"app/build/outputs/apk/$$type/acordismo-$$type-$$ts.apk\";
          fi;
        done &&
        chown -R $(stat -c '%u:%g' /app) /app/dist /app/android/app/src/main/assets /app/android/app/build/outputs
      "

volumes:
  gradle-cache:
  npm-cache:
