# File: docker-compose.yml
# Version: 1.6.0
services:
  android-builder:
    build: .
    container_name: acordismo-android-builder
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
      - npm-cache:/root/.npm
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - GRADLE_TASK=${GRADLE_TASK:-assembleDebug}
    command: >
      bash -c "
        npm run build &&
        if [ ! -f android/capacitor.settings.gradle ]; then
          npx cap sync android;
        else
          npx cap copy android;
        fi &&
        cd android &&
        (./gradlew $${GRADLE_TASK} --build-cache --offline || ./gradlew $${GRADLE_TASK} --build-cache) &&
        ts=$$(date +'%Y-%m-%d_%H-%M') &&
        for type in debug release; do
          src=\"app/build/outputs/apk/$$type/app-$$type.apk\";
          if [ -f \"$$src\" ]; then
            cp -f \"$$src\" \"app/build/outputs/apk/$$type/acordismo-$$type-$$ts.apk\";
          fi;
        done &&
        chown -R $(stat -c '%u:%g' /app) /app/dist /app/android
      "

volumes:
  gradle-cache:
  npm-cache:
